spring:
  datasource:
    url: jdbc:oracle:thin:@mock?TNS_ADMIN=${WALLET_PATH}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${APP_USER}
    password: ${APP_PASSWORD}     
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        default_schema: ${DEPLOY_USER}     
  liquibase:
    enabled: true
    user: ${DEPLOY_USER}
    password: ${DEPLOY_PASSWORD}
